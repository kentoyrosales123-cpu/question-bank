<!doctype html>
<html>
  <head>
    <title>Exam Result</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <aside class="sidebar">
        <h2>Question Bank</h2>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/upload.html">Upload Questionnaire</a>
        <a href="/generate-exam.html">Generate Exam</a>
        <a href="/profile.html">Profile</a>
        <a onclick="logout()">Logout</a>
      </aside>

      <main class="main">
        <div class="topbar">
          <h1>Exam Result</h1>
          <button class="btn secondary" onclick="toggleTheme()">
            Toggle Theme
          </button>
        </div>

        <div class="card">
          <h2 id="scoreText">Score</h2>
        </div>

        <br />

        <section class="dashboard-insights result-attainment">
          <div class="card">
            <h2>CO Attainment</h2>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>CO/CLO</th>
                    <th>Items</th>
                    <th>Correct</th>
                    <th>Weight</th>
                    <th>Target</th>
                    <th>Attainment</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="coAttainmentBody"></tbody>
              </table>
            </div>
          </div>

          <div class="card">
            <h2>SO Attainment</h2>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>SO</th>
                    <th>Performance Indicators</th>
                    <th>Items</th>
                    <th>Correct</th>
                    <th>Weight</th>
                    <th>Target</th>
                    <th>Attainment</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="soAttainmentBody"></tbody>
              </table>
            </div>
          </div>
        </section>

        <br />

        <div id="resultList"></div>
      </main>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/result.js"></script>
  </body>
</html>
