<!doctype html>
<html>
  <head>
    <title>Upload Questionnaire</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <aside class="sidebar">
        <h2>Question Bank</h2>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/questions.html">Questions</a>
        <a href="/add-question.html">Add Question</a>
        <a class="active" href="/upload.html">Upload Questionnaire</a>
        <a href="/parsed-questions.html">Review Parsed Questions</a>
        <a href="/generate-exam.html">Generate Exam</a>
        <a href="/item-analysis-upload.html">Item Analysis</a>
        <div class="nav-divider"></div>
        <a href="/profile.html">Profile</a>
        <a href="/users.html">Users</a>
        <a href="/reports.html">Reports</a>
        <a class="support-link" href="#support">Chat Support</a>
        <div class="nav-divider"></div>
        <a onclick="logout()">Logout</a>
      </aside>

      <main class="main">
        <div class="topbar">
          <h1>Upload Questionnaire</h1>
          <button class="btn secondary" onclick="toggleTheme()">
            Toggle Theme
          </button>
        </div>

        <form class="card" id="uploadForm">
          <p>
            Upload DOCX, PDF, or image questionnaire. After uploading, click
            Parse Questions.
          </p>
          <input
            id="questionnaire"
            type="file"
            accept=".docx,.pdf,image/jpeg,image/png,image/webp"
            required
          />
          <button class="btn" type="submit">Upload File</button>
          <p class="message" id="uploadMessage"></p>
        </form>

        <br />

        <div class="card">
          <h2>Uploaded Files</h2>
          <div id="uploadsList"></div>
        </div>
      </main>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/upload.js"></script>
  </body>
</html>
