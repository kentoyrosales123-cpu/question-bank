<!doctype html>
<html>
  <head>
    <title>Login</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-brand-panel">
        <div class="auth-logo-lockup">
          <div>
            <span>Question Bank System</span>
          </div>
        </div>
        <div class="auth-brand-copy">
          <p>Secure assessment tools for faculty and students.</p>
          <small
            >Generate exams, manage question banks, and review performance data
            in one place.</small
          >
        </div>
      </section>

      <form class="auth-card" id="loginForm">
        <div class="auth-form-heading">
          <span>Welcome Back</span>
          <h1>Sign in to your account</h1>
        </div>

        <label>
          <span class="field-label">Email Address</span>
          <input
            id="email"
            type="email"
            placeholder="user@example.com"
            required
          />
        </label>
        <label>
          <span class="field-label">Password</span>
          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            required
          />
        </label>

        <button class="btn" type="submit">Login</button>

        <div class="auth-link-row">
          <a href="/forgot-password.html">Forgot password?</a>
          <span>Need an account? Contact your administrator.</span>
        </div>
        <p class="message wrong" id="authMessage"></p>
      </form>
    </main>

    <script src="/js/auth.js"></script>
  </body>
</html>
