<!doctype html>
<html>
  <head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="auth-page">
      <form class="auth-card" id="forgotPasswordForm">
        <h1>Forgot Password</h1>

        <input id="email" type="email" placeholder="Email" required />

        <button class="btn" id="sendResetCodeButton" type="submit">
          Send Reset Code
        </button>

        <div class="hidden" id="resetPasswordPanel">
          <input
            id="resetOtp"
            type="text"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            placeholder="6-digit reset code"
          />
          <input
            id="newPassword"
            type="password"
            placeholder="New password"
          />
          <input
            id="confirmPassword"
            type="password"
            placeholder="Confirm new password"
          />
          <button class="btn success" id="resetPasswordButton" type="button">
            Reset Password
          </button>
          <button class="btn secondary" id="resendResetCodeButton" type="button">
            Resend Code
          </button>
        </div>

        <p>Remembered it? <a href="/login.html">Login</a></p>
        <p class="message wrong" id="authMessage"></p>
      </form>
    </main>

    <script src="/js/auth.js"></script>
  </body>
</html>
