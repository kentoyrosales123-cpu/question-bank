<!doctype html>
<html>
  <head>
    <title>Review Parsed Questions</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <aside class="sidebar">
        <h2>Question Bank</h2>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/questions.html">Questions</a>
        <a href="/add-question.html">Add Question</a>
        <a href="/upload.html">Upload Questionnaire</a>
        <a class="active" href="/parsed-questions.html"
          >Review Parsed Questions</a
        >
        <a href="/generate-exam.html">Generate Exam</a>
        <div class="nav-divider"></div>
        <a href="/users.html">Users</a>
        <a href="/dashboard.html#activityBody">Reports</a>
        <a class="settings-link" href="#settings">Settings</a>
        <div class="nav-divider"></div>
        <a onclick="logout()">Logout</a>
      </aside>

      <main class="main">
        <div class="topbar">
          <h1>Review Parsed Questions</h1>
          <button class="btn secondary" onclick="toggleTheme()">
            Toggle Theme
          </button>
        </div>

        <section class="review-toolbar">
          <div class="review-stat">
            <span>Pending</span>
            <strong id="pendingCount">0</strong>
          </div>
          <div class="review-stat">
            <span>Needs Answer</span>
            <strong id="needsAnswerCount">0</strong>
          </div>
          <div class="review-stat">
            <span>With Media</span>
            <strong id="mediaCount">0</strong>
          </div>
          <input
            id="reviewSearch"
            type="search"
            placeholder="Search parsed questions"
          />
        </section>

        <div id="parsedList"></div>
      </main>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/parsed-questions.js"></script>
  </body>
</html>
