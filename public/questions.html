<!doctype html>
<html>
  <head>
    <title>Question Bank</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <div class="dashboard-layout">
      <aside class="sidebar">
        <h2>Question Bank</h2>

        <a href="/dashboard.html">Dashboard</a>
        <a class="active" href="/questions.html">Questions</a>
        <a href="/add-question.html">Add Question</a>
        <a href="/upload.html">Upload Questionnaire</a>
        <a href="/generate-exam.html">Generate Exam</a>
        <a href="/item-analysis-upload.html">Item Analysis</a>

        <div class="nav-divider"></div>

        <a href="/profile.html">Profile</a>
        <a href="/users.html">Users</a>
        <a href="/reports.html">Reports</a>
        <a class="support-link" href="#support"> Chat Support </a>

        <div class="nav-divider"></div>

        <a onclick="logout()">Logout</a>
      </aside>

      <main class="main">
        <div class="topbar">
          <h1>Questions</h1>

          <div class="action-row">
            <button class="btn secondary" onclick="toggleTheme()">
              Toggle Theme
            </button>
          </div>
        </div>

        <div class="card question-filter-card">
          <div class="question-filter-grid">
            <input id="filterSubject" placeholder="Filter subject" />

            <input id="filterTopic" placeholder="Filter topic" />

            <select id="filterQuestionType">
              <option value="">All Question Types</option>
              <option value="Multiple Choice">Multiple Choice</option>
              <option value="Problem Solving">Problem Solving</option>
            </select>

            <select id="filterDifficulty">
              <option value="">All Difficulty</option>
              <option value="Easy">Easy</option>
              <option value="Average">Average</option>
              <option value="Difficult">Difficult</option>
            </select>

            <input id="filterCourseOutcome" placeholder="Filter CLO" />
            <input id="filterProgramOutcome" placeholder="Filter SO" />
            <input id="filterStudentLearningOutcome" placeholder="Filter SLO" />
            <select id="filterBloomLevel">
              <option value="">All Bloom Levels</option>
              <option value="Remember">Remember</option>
              <option value="Understand">Understand</option>
              <option value="Apply">Apply</option>
              <option value="Analyze">Analyze</option>
              <option value="Evaluate">Evaluate</option>
              <option value="Create">Create</option>
            </select>
          </div>
          <div class="question-filter-actions">
            <button class="btn" onclick="filterQuestions()">Filter</button>
            <button class="btn secondary" onclick="loadQuestions()">Clear</button>
          </div>
        </div>

        <br />

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Subject</th>
                <th>Program</th>
                <th>Topic</th>
                <th>Type</th>
                <th>Question</th>
                <th>Difficulty</th>
                <th>CEP</th>
                <th>OBE</th>
                <th>Answer</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody id="questionsBody"></tbody>
          </table>
        </div>

        <div class="pagination-bar" id="questionsPagination"></div>

        <!-- QUESTION VIEW / EDIT MODAL -->
        <div class="modal hidden" id="questionModal">
          <div class="modal-panel">
            <div class="modal-header">
              <h2 id="questionModalTitle">Question Details</h2>

              <button
                class="btn secondary"
                type="button"
                onclick="closeQuestionModal()"
              >
                Close
              </button>
            </div>

            <div id="questionDetails"></div>
          </div>
        </div>
      </main>
    </div>

    <script src="/js/auth.js"></script>

    <script src="/js/questions.js"></script>
  </body>
</html>
