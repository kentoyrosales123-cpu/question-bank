<!doctype html>
<html>
  <head>
    <title>Add Question</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <aside class="sidebar">
        <h2>Question Bank</h2>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/questions.html">Questions</a>
        <a class="active" href="/add-question.html">Add Question</a>
        <a href="/upload.html">Upload Questionnaire</a>
        <a href="/generate-exam.html">Generate Exam</a>
        <a href="/item-analysis-upload.html">Item Analysis</a>
        <div class="nav-divider"></div>
        <a href="/profile.html">Profile</a>
        <a href="/users.html">Users</a>
        <a href="/reports.html">Reports</a>
        <a class="support-link" href="#support">Chat Support</a>
        <div class="nav-divider"></div>
        <a onclick="logout()">Logout</a>
      </aside>

      <main class="main">
        <div class="topbar">
          <h1>Add Question</h1>
          <button class="btn secondary" onclick="toggleTheme()">
            Toggle Theme
          </button>
        </div>

        <form class="card" id="questionForm">
          <input id="subject" placeholder="Subject" required />
            <select id="engineeringProgram" required>
              <option value="">Engineering Program</option>
              <option value="GE">General Engineering</option>
              <option value="ECE">ECE</option>
              <option value="CE">CE</option>
            <option value="EE">EE</option>
            <option value="ME">ME</option>
            <option value="CpE">CpE</option>
            <option value="CHE">CHE</option>
          </select>
          <input id="topic" placeholder="Topic" required />

          <textarea
            id="questionText"
            placeholder="Question text"
            required
          ></textarea>

          <input id="choiceA" placeholder="Choice A" required />
          <input id="choiceB" placeholder="Choice B" required />
          <input id="choiceC" placeholder="Choice C" required />
          <input id="choiceD" placeholder="Choice D" required />

          <select id="correctAnswer" required>
            <option value="">Correct Answer</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>

          <select id="difficulty" required>
            <option value="">Difficulty</option>
            <option value="Easy">Easy</option>
            <option value="Average">Average</option>
            <option value="Difficult">Difficult</option>
          </select>

          <div class="field-grid two">
            <input id="courseOutcome" placeholder="CLO / Course Outcome" required />
            <input id="programOutcome" placeholder="SO / Student Outcome" required />
          </div>

          <input
            id="studentLearningOutcome"
            placeholder="SLO / Student Learning Outcome"
            required
          />

          <div class="field-grid two">
            <select id="bloomLevel" required>
              <option value="">Bloom Level</option>
              <option value="Remember">Remember</option>
              <option value="Understand">Understand</option>
              <option value="Apply">Apply</option>
              <option value="Analyze">Analyze</option>
              <option value="Evaluate">Evaluate</option>
              <option value="Create">Create</option>
            </select>
            <input
              id="outcomeWeight"
              type="number"
              min="0.1"
              step="0.1"
              value="1"
              required
              placeholder="Outcome Weight"
            />
          </div>

          <label class="checkbox-row">
            <input id="isComplexEngineeringProblem" type="checkbox" />
            <span>Complex engineering problem</span>
          </label>

          <textarea id="tableData" placeholder="Optional table data"></textarea>
          <textarea
            id="explanation"
            placeholder="Explanation / Solution"
          ></textarea>

          <label>Optional Figure/Image</label>
          <input id="image" type="file" accept="image/*" />

          <button class="btn" type="submit">Save Question</button>
          <p class="message" id="message"></p>
        </form>
      </main>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/add-question.js"></script>
  </body>
</html>
