<!doctype html>
<html>
  <head>
    <title>Register</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="auth-page um-auth-page">
      <section class="auth-brand-panel">
        <div class="auth-logo-lockup">
          <img src="/logo.avif" alt="University of Mindanao logo" />
          <div>
            <span>University of Mindanao</span>
            <strong>Question Bank System</strong>
          </div>
        </div>
        <div class="auth-brand-copy">
          <p>Build better assessments with a UM-centered question bank.</p>
          <small>Register to access exam generation, parsed question review, and item analysis tools.</small>
        </div>
      </section>

      <form class="auth-card um-auth-card" id="registerForm">
        <div class="auth-form-heading">
          <span>Get Started</span>
          <h1>Create your account</h1>
        </div>

        <label>
          <span class="field-label">Full Name</span>
          <input id="name" type="text" placeholder="Juan Dela Cruz" required />
        </label>
        <label>
          <span class="field-label">Email Address</span>
          <input id="email" type="email" placeholder="name@umindanao.edu.ph" required />
        </label>
        <label>
          <span class="field-label">Password</span>
          <input id="password" type="password" placeholder="Create a password" required />
        </label>

        <button class="btn" id="registerButton" type="submit">Register</button>

        <div class="hidden" id="verificationPanel">
          <input
            id="otp"
            type="text"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            placeholder="6-digit verification code"
          />
          <button class="btn success" id="verifyEmailButton" type="button">
            Verify Email
          </button>
          <button class="btn secondary" id="resendOtpButton" type="button">
            Resend Code
          </button>
        </div>

        <div class="auth-link-row single">
          <span>Already have an account? <a href="/login.html">Login</a></span>
        </div>
        <p class="message wrong" id="authMessage"></p>
      </form>
    </main>

    <script src="/js/auth.js"></script>
  </body>
</html>
