<!doctype html>
<html>
  <head>
    <title>Register</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="auth-page">
      <form class="auth-card" id="registerForm">
        <h1>Create Account</h1>

        <input id="name" type="text" placeholder="Full Name" required />
        <input id="email" type="email" placeholder="Email" required />
        <input id="password" type="password" placeholder="Password" required />

        <button class="btn" id="registerButton" type="submit">Register</button>

        <div class="hidden" id="verificationPanel">
          <input
            id="otp"
            type="text"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            placeholder="6-digit verification code"
          />
          <button class="btn success" id="verifyEmailButton" type="button">
            Verify Email
          </button>
          <button class="btn secondary" id="resendOtpButton" type="button">
            Resend Code
          </button>
        </div>

        <p>Already have an account? <a href="/login.html">Login</a></p>
        <p class="message wrong" id="authMessage"></p>
      </form>
    </main>

    <script src="/js/auth.js"></script>
  </body>
</html>
